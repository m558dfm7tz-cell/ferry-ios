name: Validate multi-computer iOS branch
on:
  pull_request:
    branches: [main]
    paths:
      - 'Ferry/**'
      - '.github/workflows/verify-multi-computer.yml'
  workflow_dispatch:
jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iOS simulator app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Ferry/Ferry.xcodeproj \
            -scheme Ferry \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
