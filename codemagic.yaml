# Ferry iOS V2: manual-only, unsigned iPhone IPA for Sideloadly.
# Builds the exact source of the selected branch on a free-tier macOS M2.
# Does NOT require Apple signing credentials and does NOT publish an app.
workflows:
  ferry-ios-sideloadly:
    name: Ferry iOS V2 - unsigned IPA for Sideloadly
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 16.4
    # No automatic builds: preserve the individual's free build minutes.
    triggering:
      events: []
    scripts:
      - name: Build the unsigned iPhone Release archive
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build"
          xcodebuild -version
          xcodebuild \
            -project Ferry/Ferry.xcodeproj \
            -scheme Ferry \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/Ferry-iOS.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$CM_BUILD_DIR/build/Ferry-build.log"
      - name: Package and verify unsigned IPA
        script: |
          set -euo pipefail
          APP="$CM_BUILD_DIR/build/Ferry-iOS.xcarchive/Products/Applications/Ferry.app"
          test -d "$APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          test "$BUNDLE_ID" = "com.ferry.test" || {
            echo "Unexpected app identifier: $BUNDLE_ID"
            exit 1
          }
          mkdir -p "$CM_BUILD_DIR/build/ipa/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/build/ipa/Payload/Ferry.app"
          cd "$CM_BUILD_DIR/build/ipa"
          zip -qry -y Ferry-iOS-V2-Unsigned.ipa Payload
          unzip -t Ferry-iOS-V2-Unsigned.ipa
          echo "Verified: unsigned com.ferry.test IPA for external signing"
    artifacts:
      - build/ipa/Ferry-iOS-V2-Unsigned.ipa
      - build/Ferry-build.log

  ferry-ios-multi-computer-validation:
    name: Ferry iOS - multi-computer in-place update unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: 16.4
    # Manual-only compile and IPA packaging. No simulator/UI tests; user validates on their device.
    triggering:
      events: []
    scripts:
      - name: Confirm development branch and toolchain
        script: |
          set -euo pipefail
          test "$CM_BRANCH" = "feat/multi-computer-isolation-20261029" || {
            echo "This workflow is only for the multi-computer development branch (got $CM_BRANCH)."
            exit 1
          }
          mkdir -p "$CM_BUILD_DIR/build"
          echo "Building commit $(git rev-parse HEAD)" | tee "$CM_BUILD_DIR/build/source-commit.txt"
          xcodebuild -version
          xcrun simctl list devices available
      - name: Confirm original app identity for an in-place update
        script: |
          set -euo pipefail
          # Do not rewrite IDs into com.ferry.test.multi. Existing Ferry installs
          # use com.ferry.test and the share extension com.ferry.test.FerryShare.
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.ferry.test;' Ferry/Ferry.xcodeproj/project.pbxproj
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.ferry.test.FerryShare;' Ferry/Ferry.xcodeproj/project.pbxproj
          echo "Original bundle identity preserved. Installation still requires the same Apple signing team and compatible provisioning."
      - name: Archive unsigned iPhone Release build
        script: |
          set -euo pipefail
          xcodebuild \
            -project Ferry/Ferry.xcodeproj \
            -scheme Ferry \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/Ferry-multi-computer.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$CM_BUILD_DIR/build/Ferry-multi-computer-build.log"
      - name: Package and verify unsigned development IPA
        script: |
          set -euo pipefail
          APP="$CM_BUILD_DIR/build/Ferry-multi-computer.xcarchive/Products/Applications/Ferry.app"
          test -d "$APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          test "$BUNDLE_ID" = "com.ferry.test" || {
            echo "Unexpected bundle identifier: $BUNDLE_ID"
            exit 1
          }
          mkdir -p "$CM_BUILD_DIR/build/multi-computer-ipa/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/build/multi-computer-ipa/Payload/Ferry.app"
          cd "$CM_BUILD_DIR/build/multi-computer-ipa"
          zip -qry -y Ferry-MultiComputer-INPLACE-UNSIGNED.ipa Payload
          unzip -t Ferry-MultiComputer-INPLACE-UNSIGNED.ipa
          echo "Unsigned IPA keeps com.ferry.test; sideload using the same signing identity as the installed app to preserve its data."
    artifacts:
      - build/multi-computer-ipa/Ferry-MultiComputer-INPLACE-UNSIGNED.ipa
      - build/Ferry-multi-computer-build.log
      - build/source-commit.txt
